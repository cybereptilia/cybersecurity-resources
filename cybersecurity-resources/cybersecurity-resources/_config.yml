# ------------------------------------------------------------------
# Site configuration for the GitHub Pages blog (built with Jekyll).
# GitHub reads this file automatically when Pages is enabled.
# Restart is not needed on GitHub; every push triggers a new build.
# ------------------------------------------------------------------

# Text shown in the browser tab, the header, and search results.
title: Resources for Cybersecurity Professionals
description: >-
  A small blog on data recovery, ITIL, ethics and legislation, disaster
  recovery, and incident response, written for CECS 6230 IT Operations
  at Polytechnic University of Puerto Rico.
author: Rosaliz V. Garcia

# Address of the site. "url" is the GitHub Pages domain for the account;
# "baseurl" is the repository name. Together they produce:
#   https://cybereptilia.github.io/cybersecurity-resources/
# If you name the repository differently, change baseurl to match.
url: "https://cybereptilia.github.io"
baseurl: "/cybersecurity-resources"

# Minima is a simple theme that GitHub Pages supports out of the box,
# so no extra installation is required.
theme: minima

# Pages listed in the top navigation bar, in this order.
header_pages:
  - resources.md
  - about.md

# Show a short excerpt of each post on the home page.
show_excerpts: true

# Markdown engine used by GitHub Pages (supports tables).
markdown: kramdown

# Theme options: link to the GitHub profile in the footer.
minima:
  social_links:
    github: cybereptilia

# Files in the repository that should not be published as pages.
exclude:
  - README.md
